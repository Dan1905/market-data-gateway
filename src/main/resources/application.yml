spring:
  application:
    name: market-data-gateway

  # Java 21 virtual threads for Tomcat request handling and @Async. The ingest path has
  # its own explicit virtual-thread executor (see VirtualThreadConfig) because frames
  # arrive on the JDK HttpClient's threads, not through Spring.
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # acks / idempotence / linger / compression are set in KafkaConfig so they stay
      # consistent across both the canonical and DLQ producers.
      properties:
        # delivery.timeout.ms MUST stay below gateway.producer.send-timeout (5s). If the
        # gateway stops waiting first, it treats a record Kafka is still delivering as
        # failed and sends it again, and both copies land on the topic. That is not a
        # theory: it produced duplicate trades at adjacent offsets during a broker stall.
        # KafkaConfig refuses to start if the two are the wrong way round.
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
        max.in.flight.requests.per.connection: 5
    consumer:
      # Used only by the on-demand DLQ replay consumer.
      properties:
        session.timeout.ms: 15000
    admin:
      # Topic creation runs during context startup. The Kafka defaults here are 30s
      # request / 60s api timeout, so an unreachable broker turns a 4-second boot into
      # a 45-second one. Failing the topic creation quickly is the better trade: the
      # gateway starts, serves /actuator/health, and the producer's own retry and
      # circuit breaker handle the broker coming back.
      properties:
        request.timeout.ms: 8000
        default.api.timeout.ms: 8000
        retries: 1

  lifecycle:
    # Let in-flight sends drain before the context tears down.
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

gateway:
  topics:
    normalized: normalized-market-data
    dead-letter: market-data-dlq
    partitions: 3
    replication-factor: 1
    # Disk is the binding constraint on a free-tier box: this pipeline writes ~1 GB/day
    # at ~25 events/sec across three venues. 24h keeps the whole stack inside an 8 GB
    # root volume. Raise only after attaching a bigger EBS volume.
    normalized-retention: 24h
    dead-letter-retention: 7d

  symbol:
    # true  -> BTCUSDT normalizes to BTC-USD  (matches the canonical example)
    # false -> BTCUSDT normalizes to BTC-USDT (keeps USDT and USD distinct)
    # See SymbolNormalizer: these are genuinely different assets.
    collapse-stablecoins: true

  producer:
    send-timeout: 5s

  spill:
    # Events the broker will not take are kept on disk here and published, in order, when
    # it is back. Put it on a volume: in Docker this is the `gateway-state` volume.
    enabled: ${SPILL_ENABLED:true}
    directory: ${SPILL_DIRECTORY:data/spill}
    # Bounded so an outage cannot fill a free-tier disk. Past this, events go to the DLQ.
    max-bytes: ${SPILL_MAX_BYTES:268435456}   # 256 MB, about 5 hours of a 3-venue BTC feed
    fsync: true

  backfill:
    # When a symbol's next trade id is not the next id (after a reconnect, a restart or a
    # redeploy), the missing trades are fetched from the venue's REST API and published
    # first, flagged `backfilled`. Positions are saved here so a restart sees its own
    # downtime as a gap; keep it on a volume.
    enabled: ${BACKFILL_ENABLED:true}
    state-file: ${BACKFILL_STATE_FILE:data/state/trade-positions.json}
    # Per gap. A longer gap recovers its newest part and counts the rest as missing.
    max-gap: ${BACKFILL_MAX_GAP:20000}
    calls-per-second: 2

  lanes:
    # Events queued or publishing across all per-symbol lanes. When full, socket reads
    # pause, so a slow broker pushes TCP backpressure to the venue instead of growing heap.
    max-in-flight: ${LANES_MAX_IN_FLIGHT:1000}
    drain-timeout: 10s

  dlq:
    replay-group-prefix: market-data-gateway-replay
    replay-max-duration: 5m
    failure-sample-limit: 10

  exchanges:
    binance:
      enabled: ${BINANCE_ENABLED:true}
      # Bare /ws endpoint: the client sends SUBSCRIBE frames built from `symbols`.
      uri: ${BINANCE_URI:wss://stream.binance.com:9443/ws}
      # Comma-separated in env, e.g. BINANCE_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT (max 1024).
      symbols: ${BINANCE_SYMBOLS:BTCUSDT}
      limits:
        # Binance allows 5 incoming messages/second per connection and counts our pongs
        # and every SUBSCRIBE against it. Exceeding it disconnects; repeat offenders get
        # their IP banned. One below the limit leaves room for a pong.
        outbound-messages-per-second: 4
      idle-timeout: 45s
      backoff:
        initial-delay: 1s
        max-delay: 60s
        multiplier: 2.0
        jitter: 0.5

    coinbase:
      enabled: ${COINBASE_ENABLED:true}
      uri: ${COINBASE_URI:wss://advanced-trade-ws.coinbase.com}
      symbols: ${COINBASE_SYMBOLS:BTC-USD}
      # Coinbase heartbeats keep this socket producing frames during quiet periods.
      idle-timeout: 45s
      backoff:
        initial-delay: 1s
        max-delay: 60s
        multiplier: 2.0
        jitter: 0.5

    kraken:
      enabled: ${KRAKEN_ENABLED:true}
      uri: ${KRAKEN_URI:wss://ws.kraken.com/v2}
      symbols: ${KRAKEN_SYMBOLS:BTC/USD}
      # Kraken's own heartbeat channel is ~1/s, so a shorter idle window is safe here.
      idle-timeout: 30s
      backoff:
        initial-delay: 1s
        max-delay: 60s
        multiplier: 2.0
        jitter: 0.5

# ---------------------------------------------------------------------------
# Resilience4j
#
# The circuit breaker and retry guard the *broker publish*, not the parser. Parse
# failures are deterministic — retrying corrupt JSON only delays the DLQ write — so
# they short-circuit straight to the dead letter queue. See MarketDataProducer.
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20          # don't trip on a handful of startup blips
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 4s     # just under the 5s producer send timeout
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - com.mdg.gateway.exception.MarketDataPublishException
          - org.apache.kafka.common.errors.TimeoutException
          - org.springframework.kafka.KafkaException
      # One breaker per venue CONNECTION (see VenueConnectionGuard). A "call" is a whole
      # connection attempt, and it only succeeds once the socket has stayed up for
      # gateway.exchanges.<venue>.limits.stable-after. Five failed or short-lived
      # connections in a row open it; while open the gateway does not dial the venue at
      # all, then it lets exactly one probe through. This is what stops a reconnect loop
      # from turning a rate limit into an IP ban.
      venue-connection:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 2m
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        # The `exchanges` health indicator already reports venue state.
        register-health-indicator: false
    instances:
      kafka-producer:
        base-config: default
      venue-binance:
        base-config: venue-connection
      venue-coinbase:
        base-config: venue-connection
      venue-kraken:
        base-config: venue-connection

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        # Spread retries so a broker restart doesn't get a synchronized second wave.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - com.mdg.gateway.exception.MarketDataPublishException
        ignore-exceptions:
          # An open breaker is an instruction to stop, not a transient fault. Without
          # this, every call would burn its full retry budget against an open breaker.
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      kafka-producer:
        base-config: default

  ratelimiter:
    configs:
      default:
        # A CPU ceiling on ingest, sized well above steady state. Over the limit, the
        # socket reader WAITS for a permit rather than dropping the frame: while it waits
        # no further frames are read, so the burst stays in the TCP buffer (backpressure)
        # instead of being lost. Only a frame still refused after the full wait is dropped
        # and counted in mdg.frames.throttled -- alert on it.
        limit-for-period: ${INGEST_RATE_LIMIT:5000}
        limit-refresh-period: 1s
        timeout-duration: 5s
        register-health-indicator: false
    instances:
      ingestion:
        base-config: default

# ---------------------------------------------------------------------------
# API documentation
#
# Two specs, describing two different things — see OpenApiConfig for why:
#   /swagger-ui.html  OpenAPI — the HTTP control plane (DLQ replay). Small by design.
#   /asyncapi.html    AsyncAPI — the Kafka event contract. This is what consumers need.
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    # Collapse the schema dump on load; the replay contract is small enough to read.
    doc-expansion: list

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.mdg.gateway: INFO
    # Each of these dumps its full config block at INFO on every client construction,
    # which on a DLQ replay means a screenful per request.
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
    org.apache.kafka.common.utils.AppInfoParser: WARN
