name: CD

# ---------------------------------------------------------------------------
# Continuous delivery: build once, publish to GHCR, deploy to EC2 over SSH.
#
# DELIVERY MODEL
#   The image is built on a runner and PULLED by the instance. It is never built on the
#   instance: `docker compose build` runs a full Maven build, which a 1 GB t3.micro cannot
#   survive even with swap. Building once also guarantees the artifact that was tested is
#   byte-for-byte the artifact that runs.
#
# WHEN IT RUNS
#   push to main      -> publish an image tagged with the commit SHA. No deploy.
#   push tag v*       -> publish, then deploy that exact tag.
#   manual dispatch   -> deploy any already-published tag you name.
#
#   Deploying on a tag rather than on every push to main is deliberate: it makes releases
#   explicit and makes rollback a matter of re-running this workflow with an older tag.
#   To deploy every green main build instead, add `github.ref == 'refs/heads/main'` to the
#   deploy job's `if`.
#
# REQUIRED REPOSITORY SECRETS  (Settings -> Secrets and variables -> Actions)
#   EC2_HOST          public DNS or IP of the instance
#   EC2_USER          ec2-user (Amazon Linux) or ubuntu (Ubuntu)
#   EC2_SSH_KEY       the PRIVATE key, whole file including BEGIN/END lines
#
#   GITHUB_TOKEN is provided automatically and is what pushes to GHCR.
#
# ONE-TIME INSTANCE SETUP
#   See deploy/README.md. The instance needs Docker, a clone of this repo at
#   /opt/market-data-gateway, and a .env holding SITE_ADDRESS and the Caddy basic-auth
#   hash. This pipeline appends GATEWAY_IMAGE to that .env on each deploy.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published tag to deploy (e.g. v1.0.0). Must already exist in GHCR.'
        required: true
        type: string

concurrency:
  # Never let two deploys race for the same instance.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MAVEN_ARGS: -B -ntp

jobs:

  # ---------------------------------------------------------------------------
  # Gate. Unlike ci.yml, publishing IS gated on tests - nothing reaches a registry
  # that the full suite has not passed against this exact commit.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A manual dispatch deploys an already-published, already-verified tag.
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Register JDK 21 toolchain
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0">
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          XML

      - name: Verify
        run: mvn $MAVEN_ARGS clean verify

  # ---------------------------------------------------------------------------
  # Publish to GitHub Container Registry.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: verify
    if: always() && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'workflow_dispatch'

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image reference
        id: meta
        run: |
          REPO=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "repo=$REPO"        >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "image=$REPO:$TAG"  >> "$GITHUB_OUTPUT"
          echo "Image: $REPO:$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        if: github.event_name != 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # EC2 t2/t3.micro are x86_64. Building only amd64 avoids QEMU emulation, which
          # would make this step several times slower for an architecture nothing runs.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}
          # The verify job already ran the full suite against this commit.
          build-args: |
            SKIP_TESTS=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to EC2.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    # Only on an explicit release tag or a manual dispatch - never on a plain main push.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    # Create a `production` environment in repo settings to require an approval here.
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS || 'your-host' }}

    # id-token: the job asks GitHub for a short-lived OIDC token and trades it for AWS
    # credentials. No AWS keys are stored anywhere.
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      # The git ref whose compose files go with this image: the pushed tag, or the tag
      # named in a manual redeploy.
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}

    steps:
      # Two ways in. SSM (preferred) needs no inbound port at all: AWS relays the command to
      # the SSM agent already running on the instance, so port 22 can stay closed to the
      # internet. SSH is the fallback until the AWS role is set up (deploy/README.md).
      - name: Choose how to reach the instance
        id: method
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          require() { for v in "$@"; do if [ -z "${!v}" ]; then echo "::error::Missing $v"; missing=1; fi; done; }
          # Both ways need these: the user that owns the clone, and the public host for the
          # post-deploy check.
          require EC2_HOST EC2_USER
          if [ -n "$AWS_DEPLOY_ROLE_ARN" ]; then
            require AWS_REGION EC2_INSTANCE_ID
            echo "via=ssm" >> "$GITHUB_OUTPUT"
            echo "Deploying over SSM (no inbound SSH needed)" >> "$GITHUB_STEP_SUMMARY"
          else
            require EC2_SSH_KEY
            echo "via=ssh" >> "$GITHUB_OUTPUT"
            echo "Deploying over SSH. Set AWS_DEPLOY_ROLE_ARN to deploy over SSM instead." >> "$GITHUB_STEP_SUMMARY"
          fi
          # These two are pasted into a shell on the instance, so they must be plain names.
          [[ "$IMAGE" =~ ^[a-z0-9./:_-]+$ ]] || { echo "::error::Unexpected image name: $IMAGE"; missing=1; }
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Unexpected ref: $DEPLOY_REF"; missing=1; }
          [ "$missing" = "0" ] || exit 1

      # ---------------- over SSM ----------------

      - name: Get AWS credentials (OIDC)
        if: steps.method.outputs.via == 'ssm'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy over SSM
        if: steps.method.outputs.via == 'ssm'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          # SSM runs commands as root. The clone belongs to the deploy user (git, .env and
          # docker group membership are all theirs), so the script runs as that user.
          # Only deploy.sh is taken from the release first; it then fetches the rest itself.
          script="cd /opt/market-data-gateway && git fetch --all --tags --force --quiet"
          script="$script && git checkout --quiet '$DEPLOY_REF' -- deploy/deploy.sh"
          script="$script && bash deploy/deploy.sh '$IMAGE' '$DEPLOY_REF'"
          jq -n --arg user "$EC2_USER" --arg script "$script" \
            '{commands: ["runuser -l \($user) -c \"\($script)\""], executionTimeout: ["600"]}' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $DEPLOY_REF" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"

          # Poll rather than `aws ssm wait`, whose fixed ~100 s limit is shorter than a
          # deploy that pulls an image and waits for the health check.
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- output from the instance -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true
          echo "------------------------------------"
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy finished with status $status (deploy.sh rolls back on a failed health check)"
            exit 1
          fi

      # ---------------- over SSH (fallback) ----------------

      - name: Deploy over SSH
        if: steps.method.outputs.via == 'ssh'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DEPLOY_REF
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /opt/market-data-gateway
            git fetch --all --tags --force --quiet
            git checkout --quiet "$DEPLOY_REF" -- deploy/deploy.sh
            bash deploy/deploy.sh "$IMAGE" "$DEPLOY_REF"

      - name: Post-deploy verification
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Liveness is the one endpoint Caddy leaves unauthenticated, so it is the only
          # thing this job can check from outside without holding the basic-auth password.
          for _ in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://$HOST/actuator/health/liveness" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Public liveness endpoint is up." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::Public liveness check did not return 200. The container is healthy on the instance, so check Caddy, DNS and the security group."
